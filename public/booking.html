<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Your Booking | SkyWay Airlines</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <style>
    .progress-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 3rem;
      position: relative;
    }
    .progress-bar::before {
      content: '';
      position: absolute;
      top: 50%; left: 0; right: 0;
      height: 2px;
      background: rgba(0,0,0,0.1);
      z-index: 1;
      transform: translateY(-50%);
    }
    body.dark-mode .progress-bar::before { background: rgba(255,255,255,0.1); }

    .prog-step {
      background: var(--bg);
      border: 2px solid rgba(0,0,0,0.1);
      border-radius: 50%;
      width: 40px; height: 40px;
      display: flex; justify-content: center; align-items: center;
      font-weight: bold;
      position: relative;
      z-index: 2;
      color: var(--text-muted);
      transition: all 0.3s;
    }
    .prog-step.active {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }
    .prog-step.active ~ .prog-step { border-color: rgba(0,0,0,0.1); background: var(--bg); color: var(--text-muted); }

    .seat-map-container {
      background: var(--bg);
      border-radius: 100px 100px 20px 20px;
      padding: 3rem 1.5rem;
      max-width: 400px;
      margin: 0 auto;
      border: 2px solid rgba(0,0,0,0.05);
      position: relative;
    }
    .seat {
      width: 35px; height: 35px;
      border-radius: 8px;
      background: var(--success);
      color: #fff;
      display: flex; justify-content: center; align-items: center;
      font-size: 0.75rem;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .seat:hover:not(.taken) { transform: scale(1.1); }
    .seat.premium { background: var(--accent); color: var(--text); }
    .seat.taken { background: var(--text-muted); cursor: not-allowed; opacity: 0.5; }
    .seat.selected { background: var(--secondary); box-shadow: 0 0 10px var(--secondary); }

    .sticky-sidebar {
      position: sticky;
      top: 100px;
    }

    .addon-card {
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 8px;
      padding: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    .addon-card:hover { border-color: var(--primary); }
  </style>
</head>
<body class="bg-soft">

  <!-- Navbar -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">
        <i class="fas fa-plane-departure"></i> SkyWay
      </a>
      <div class="nav-actions">
        <button id="hamburger" class="hamburger">
          <i class="fas fa-bars"></i>
        </button>
      </div>
    </div>
  </nav>

  <div class="section pt-0" style="padding-top: 120px;">
    <div class="container">
      
      <div class="grid" style="display: grid; grid-template-columns: 1fr 350px; gap: 2rem;">
        
        <!-- Main Form Area -->
        <main>
          <!-- Progress Bar -->
          <div class="progress-bar">
            <div class="prog-step active" id="prog-1">1</div>
            <div class="prog-step" id="prog-2">2</div>
            <div class="prog-step" id="prog-3">3</div>
          </div>

          <!-- Step 1: Passengers -->
          <div id="step-1" class="animate-fade-in">
            <h2 class="mb-4">Passenger Details</h2>
            <div id="passengers-container"></div>
            
            <div class="card mb-4">
              <h4 class="mb-4">Contact Information</h4>
              <div class="grid" style="display:grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                  <label class="form-label">Email</label>
                  <input type="email" class="form-control" required>
                </div>
                <div class="form-group">
                  <label class="form-label">Phone</label>
                  <input type="tel" class="form-control" required>
                </div>
              </div>
            </div>

            <div class="text-right">
              <button type="button" class="btn btn-primary" id="to-step-2">Continue to Seats <i class="fas fa-arrow-right"></i></button>
            </div>
          </div>

          <!-- Step 2: Seats -->
          <div id="step-2" style="display: none;" class="animate-fade-in">
            <h2 class="mb-4">Select Your Seats</h2>
            
            <div class="flex gap-4 justify-center mb-4">
              <div class="flex items-center gap-2"><div class="seat premium" style="width:20px;height:20px"></div> Premium</div>
              <div class="flex items-center gap-2"><div class="seat" style="width:20px;height:20px"></div> Available</div>
              <div class="flex items-center gap-2"><div class="seat taken" style="width:20px;height:20px"></div> Taken</div>
              <div class="flex items-center gap-2"><div class="seat selected" style="width:20px;height:20px"></div> Selected</div>
            </div>

            <div class="seat-map-container" id="seat-map">
              <!-- Rendered via JS -->
            </div>

            <div class="flex justify-between mt-8">
              <button type="button" class="btn btn-outline" id="back-to-1"><i class="fas fa-arrow-left"></i> Back</button>
              <button type="button" class="btn btn-primary" id="to-step-3">Continue to Add-ons <i class="fas fa-arrow-right"></i></button>
            </div>
          </div>

          <!-- Step 3: Add-ons & Review -->
          <div id="step-3" style="display: none;" class="animate-fade-in">
            <h2 class="mb-4">Add-ons & Extras</h2>
            
            <div class="card mb-4">
              <h4 class="mb-4"><i class="fas fa-suitcase-rolling text-primary"></i> Extra Baggage</h4>
              <div class="flex gap-4 flex-wrap">
                <label class="addon-card flex-1">
                  <input type="radio" name="baggage" value="0" checked> 0kg (Included)
                </label>
                <label class="addon-card flex-1">
                  <input type="radio" name="baggage" value="30"> 20kg (+$30)
                </label>
                <label class="addon-card flex-1">
                  <input type="radio" name="baggage" value="50"> 30kg (+$50)
                </label>
              </div>
            </div>

            <div class="card mb-4">
              <h4 class="mb-4"><i class="fas fa-shield-alt text-primary"></i> Travel Insurance</h4>
              <label class="flex items-center gap-4">
                <input type="checkbox" id="insurance-toggle" style="width:20px; height:20px;">
                <div>
                  <strong>Comprehensive Coverage</strong>
                  <div class="text-muted text-sm">Medical, trip cancellation, and lost baggage (+$25/pax)</div>
                </div>
              </label>
            </div>

            <div class="flex justify-between mt-8">
              <button type="button" class="btn btn-outline" id="back-to-2"><i class="fas fa-arrow-left"></i> Back</button>
              <button type="button" class="btn btn-success" id="confirm-btn" style="background:var(--success); color:#fff; border:none;">Confirm Booking <i class="fas fa-check"></i></button>
            </div>
          </div>

        </main>

        <!-- Sidebar Summary -->
        <aside>
          <div class="card sticky-sidebar card-top-accent coral">
            <h3 class="mb-4">Order Summary</h3>
            
            <div class="flex justify-between mb-2">
              <span>Base Fare</span>
              <span id="sum-base">$0</span>
            </div>
            <div class="flex justify-between mb-2">
              <span>Selected Seats</span>
              <span id="sum-seats" class="text-secondary">None</span>
            </div>
            <div class="flex justify-between mb-2">
              <span>Add-ons</span>
              <span id="sum-addons">$0</span>
            </div>
            <div class="flex justify-between mb-4 text-success">
              <span>Discount</span>
              <span id="sum-discount">$0</span>
            </div>

            <hr style="border:none; border-top:1px dashed rgba(0,0,0,0.1); margin: 1rem 0;">

            <div class="flex justify-between mb-4">
              <strong>Total Amount</strong>
              <strong style="font-size: 1.5rem; color: var(--primary);" id="sum-total">$0</strong>
            </div>

            <div class="form-group flex gap-2">
              <input type="text" id="promo-code" class="form-control" placeholder="Promo Code">
              <button type="button" id="apply-promo" class="btn btn-outline">Apply</button>
            </div>
          </div>
        </aside>

      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/booking.js"></script>
</body>
</html>
