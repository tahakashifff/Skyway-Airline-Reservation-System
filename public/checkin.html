<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Check-in | SkyWay Airlines</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <style>
    .boarding-pass-wrapper {
      perspective: 1000px;
      max-width: 800px;
      margin: 0 auto;
    }
    .boarding-pass {
      background: #fff;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      overflow: hidden;
      position: relative;
    }
    body.dark-mode .boarding-pass { background: var(--bg-soft); }

    .bp-left {
      flex: 3;
      padding: 2rem;
      border-right: 2px dashed rgba(0,0,0,0.1);
      position: relative;
    }
    body.dark-mode .bp-left { border-right-color: rgba(255,255,255,0.1); }

    .bp-right {
      flex: 1;
      padding: 2rem;
      background: var(--primary);
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    /* Torn edge effect */
    .bp-left::before, .bp-left::after {
      content: '';
      position: absolute;
      right: -15px;
      width: 30px; height: 30px;
      background: var(--bg-soft);
      border-radius: 50%;
      z-index: 10;
    }
    .bp-left::before { top: -15px; }
    .bp-left::after { bottom: -15px; }

    .bp-header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;
    }
    .bp-grid {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1.5rem;
    }
    .bp-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }
    .bp-val { font-size: 1.25rem; font-weight: bold; }
    .bp-val-lg { font-size: 2.5rem; font-weight: 900; color: var(--secondary); }

    .qr-placeholder {
      width: 120px; height: 120px;
      background: #fff;
      padding: 10px;
      border-radius: 8px;
    }
  </style>
</head>
<body class="bg-soft">

  <!-- Navbar -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">
        <i class="fas fa-plane-departure"></i> SkyWay
      </a>
      <div class="nav-links" id="nav-links">
        <a href="index.html">Home</a>
        <a href="bookings.html">My Bookings</a>
        <a href="checkin.html" class="text-primary">Check-In</a>
        <a href="status.html">Flight Status</a>
      </div>
      <div class="nav-actions">
        <button id="hamburger" class="hamburger">
          <i class="fas fa-bars"></i>
        </button>
      </div>
    </div>
  </nav>

  <div class="section" style="padding-top: 150px; min-height: 100vh;">
    <div class="container">
      
      <!-- Checkin Form -->
      <div id="checkin-form-container" class="card card-top-accent" style="max-width: 500px; margin: 0 auto;">
        <h2 class="text-center mb-4">Online Check-in</h2>
        <p class="text-center text-muted mb-6">Check-in online up to 24 hours before your flight.</p>
        
        <form>
          <div class="form-group">
            <label class="form-label">Booking Reference</label>
            <input type="text" id="booking-ref-input" class="form-control" placeholder="e.g. SW-1A2B3C" required style="text-transform: uppercase;">
          </div>
          <div class="form-group mb-6">
            <label class="form-label">Last Name</label>
            <input type="text" id="last-name-input" class="form-control" placeholder="e.g. Doe" required>
          </div>
          <button type="button" id="find-booking-btn" class="btn btn-primary btn-block">Find Booking</button>
        </form>
      </div>

      <!-- Boarding Pass Result -->
      <div id="boarding-pass-container" style="display: none;" class="animate-fade-in">
        <h2 class="text-center mb-6">Your Boarding Pass is Ready</h2>
        
        <div class="boarding-pass-wrapper">
          <div class="boarding-pass">
            <div class="bp-left">
              <div class="bp-header">
                <div class="logo"><i class="fas fa-plane-departure"></i> SkyWay</div>
                <div class="badge badge-success">Boarding Pass</div>
              </div>
              
              <div class="bp-grid mb-4">
                <div>
                  <div class="bp-label">Passenger</div>
                  <div class="bp-val" id="bp-name">---</div>
                </div>
                <div>
                  <div class="bp-label">Flight</div>
                  <div class="bp-val" id="bp-flight">---</div>
                </div>
                <div>
                  <div class="bp-label">Date</div>
                  <div class="bp-val" id="bp-date">---</div>
                </div>
              </div>

              <div class="mb-4">
                <div class="bp-label">Route</div>
                <div class="bp-val-lg" id="bp-route">--- ✈ ---</div>
              </div>

              <div class="bp-grid">
                <div>
                  <div class="bp-label">Boarding Time</div>
                  <div class="bp-val text-primary" id="bp-time">---</div>
                </div>
                <div>
                  <div class="bp-label">Gate</div>
                  <div class="bp-val">A12</div>
                </div>
                <div>
                  <div class="bp-label">Class</div>
                  <div class="bp-val" id="bp-class">---</div>
                </div>
              </div>
            </div>

            <div class="bp-right">
              <div class="bp-label" style="color:rgba(255,255,255,0.7);">Seat</div>
              <div style="font-size: 3rem; font-weight: 900; margin-bottom: 1rem;" id="bp-seat">---</div>
              <div class="qr-placeholder">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=BoardingPass" alt="QR" style="width:100%; height:100%;">
              </div>
              <div class="mt-2" style="font-size:0.75rem; opacity:0.8;">Scan at Gate</div>
            </div>
          </div>
        </div>

        <div class="text-center mt-8">
          <button class="btn btn-outline" onclick="window.print()"><i class="fas fa-print"></i> Print Boarding Pass</button>
          <button class="btn btn-primary"><i class="fas fa-download"></i> Save to Wallet</button>
        </div>
      </div>

    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/checkin.js"></script>
</body>
</html>
