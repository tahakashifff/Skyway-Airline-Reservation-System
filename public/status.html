<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flight Status | SkyWay Airlines</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <style>
    .status-progress-container {
      position: relative;
      margin: 3rem 0;
      padding: 0 1rem;
    }
    .status-line {
      height: 4px;
      background: rgba(0,0,0,0.1);
      width: 100%;
      border-radius: 2px;
      position: relative;
    }
    body.dark-mode .status-line { background: rgba(255,255,255,0.1); }
    
    .status-fill {
      position: absolute;
      top: 0; left: 0; height: 100%;
      background: var(--primary);
      border-radius: 2px;
      transition: width 1s ease-in-out;
    }
    .status-points {
      position: absolute;
      top: -6px; left: 0; width: 100%;
      display: flex; justify-content: space-between;
    }
    .status-point {
      width: 16px; height: 16px;
      background: var(--bg);
      border: 4px solid var(--primary);
      border-radius: 50%;
      position: relative;
    }
    .status-label {
      position: absolute;
      top: 25px; left: 50%;
      transform: translateX(-50%);
      font-size: 0.75rem;
      font-weight: bold;
      color: var(--text-muted);
      white-space: nowrap;
    }
  </style>
</head>
<body class="bg-soft">

  <!-- Navbar -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">
        <i class="fas fa-plane-departure"></i> SkyWay
      </a>
      <div class="nav-links" id="nav-links">
        <a href="index.html">Home</a>
        <a href="bookings.html">My Bookings</a>
        <a href="checkin.html">Check-In</a>
        <a href="status.html" class="text-primary">Flight Status</a>
      </div>
      <div class="nav-actions">
        <button id="hamburger" class="hamburger">
          <i class="fas fa-bars"></i>
        </button>
      </div>
    </div>
  </nav>

  <div class="section" style="padding-top: 150px; min-height: 100vh;">
    <div class="container" style="max-width: 800px;">
      
      <div class="card card-top-accent mb-8">
        <h2 class="mb-4 text-center">Track Flight Status</h2>
        <div class="flex gap-4" style="flex-wrap: wrap;">
          <input type="text" id="status-flight-no" class="form-control" placeholder="Flight Number (e.g. SW101)" style="flex:1; text-transform: uppercase;">
          <button id="status-search-btn" class="btn btn-primary" style="white-space: nowrap;"><i class="fas fa-search"></i> Check Status</button>
        </div>
      </div>

      <div id="status-result" class="card" style="display: none;">
        <div class="flex justify-between items-center flex-wrap gap-4 mb-6">
          <div>
            <h2 id="st-flight" style="margin:0;">SW101</h2>
            <div id="st-route" class="text-muted">JFK ✈ LHR</div>
          </div>
          <div id="st-badge" class="badge badge-success" style="font-size: 1rem;">On Time</div>
        </div>

        <div class="grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 2rem; margin-bottom: 2rem;">
          <div>
            <div class="text-muted" style="font-size: 0.875rem;">Scheduled Time</div>
            <div style="font-size: 1.5rem; font-weight: bold;" id="st-scheduled">08:00</div>
          </div>
          <div>
            <div class="text-muted" style="font-size: 0.875rem;">Actual Time</div>
            <div style="font-size: 1.5rem; font-weight: bold; color: var(--primary);" id="st-actual">08:00</div>
          </div>
          <div>
            <div class="text-muted" style="font-size: 0.875rem;">Terminal / Gate</div>
            <div style="font-size: 1.5rem; font-weight: bold;">T<span id="st-term">4</span> - <span id="st-gate">A12</span></div>
          </div>
        </div>

        <!-- Progress Bar -->
        <div class="status-progress-container">
          <div class="status-line">
            <div class="status-fill" id="st-progress" style="width: 0%;"></div>
            <div class="status-points">
              <div class="status-point"><div class="status-label">Scheduled</div></div>
              <div class="status-point"><div class="status-label">Boarding</div></div>
              <div class="status-point"><div class="status-label">Departed</div></div>
              <div class="status-point"><div class="status-label">Landed</div></div>
            </div>
          </div>
        </div>

        <div style="background: rgba(0,174,239,0.05); padding: 1rem; border-radius: 8px; margin-top: 3rem; display: flex; gap: 1rem; align-items: center;">
          <i class="fas fa-info-circle text-primary" style="font-size: 1.5rem;"></i>
          <div>
            <strong>Aircraft:</strong> <span id="st-aircraft">Boeing 777</span><br>
            <span class="text-muted" style="font-size: 0.875rem;">Status updates are real-time. Please check monitors at the airport for gate changes.</span>
          </div>
        </div>

      </div>

    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/status.js"></script>
</body>
</html>
