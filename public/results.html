<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Results | SkyWay Airlines</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <style>
    .sticky-header {
      position: sticky;
      top: 60px; /* Below navbar */
      z-index: 100;
      background: var(--primary);
      color: #fff;
      padding: 1rem 0;
      box-shadow: var(--shadow-sm);
    }
    
    .filter-sidebar {
      background: var(--bg);
      padding: 1.5rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(0,0,0,0.05);
    }

    body.dark-mode .filter-sidebar {
      border: 1px solid rgba(255,255,255,0.05);
    }

    .price-strip {
      display: flex;
      gap: 1rem;
      overflow-x: auto;
      padding-bottom: 1rem;
      margin-bottom: 2rem;
    }

    .price-day {
      min-width: 100px;
      padding: 1rem;
      text-align: center;
      background: var(--bg);
      border-radius: 8px;
      border: 1px solid rgba(0,0,0,0.05);
      cursor: pointer;
      transition: all 0.2s;
    }
    .price-day:hover, .price-day.active {
      border-color: var(--primary);
      background: rgba(0, 174, 239, 0.05);
    }
    .price-day.active { border-width: 2px; }

  </style>
</head>
<body>

  <!-- Page Loader -->
  <div id="page-loader" class="page-loader">
    <i class="fas fa-plane loader-plane"></i>
    <div class="loader-line"></div>
  </div>

  <!-- Navbar -->
  <nav class="navbar" style="position: sticky;">
    <div class="container">
      <a href="index.html" class="logo">
        <i class="fas fa-plane-departure"></i> SkyWay
      </a>
      <div class="nav-links" id="nav-links">
        <a href="index.html">Home</a>
        <a href="bookings.html">My Bookings</a>
      </div>
      <div class="nav-actions">
        <button id="hamburger" class="hamburger">
          <i class="fas fa-bars"></i>
        </button>
      </div>
    </div>
  </nav>

  <!-- Sticky Search Summary -->
  <div class="sticky-header" style="top: 80px; background: rgba(15,23,42,0.9); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.05);">
    <div class="container flex justify-between items-center" style="flex-wrap: wrap; gap: 1rem;">
      <div>
        <h2 id="search-summary-title" style="margin: 0; color: #fff;">JFK to LHR</h2>
        <div id="search-summary-details" style="opacity: 0.8; font-size: 0.875rem;">12 Oct 2024 | 1 Passenger | Economy</div>
      </div>
      <a href="index.html" class="btn" style="background: rgba(255,255,255,0.2); color: #fff;">Change Search</a>
    </div>
  </div>

  <div class="section bg-soft">
    <div class="container">
      
      <!-- Price Calendar Strip -->
      <div class="price-strip">
        <div class="price-day"><div class="text-muted" style="font-size: 0.75rem;">Oct 10</div><strong>$480</strong></div>
        <div class="price-day"><div class="text-muted" style="font-size: 0.75rem;">Oct 11</div><strong>$460</strong></div>
        <div class="price-day active"><div class="text-muted" style="font-size: 0.75rem;">Oct 12</div><strong class="text-secondary">$450</strong></div>
        <div class="price-day"><div class="text-muted" style="font-size: 0.75rem;">Oct 13</div><strong>$510</strong></div>
        <div class="price-day"><div class="text-muted" style="font-size: 0.75rem;">Oct 14</div><strong>$490</strong></div>
        <div class="price-day"><div class="text-muted" style="font-size: 0.75rem;">Oct 15</div><strong>$520</strong></div>
      </div>

      <div class="grid" style="display: grid; grid-template-columns: 250px 1fr; gap: 2rem;">
        
        <!-- Sidebar -->
        <aside>
          <div class="filter-sidebar">
            <h3 class="mb-4">Filters</h3>
            
            <div class="mb-4">
              <label class="form-label">Price Range (Max)</label>
              <input type="range" class="form-control filter-input" min="100" max="1500" value="1000" oninput="this.nextElementSibling.value = '$' + this.value">
              <output>$1000</output>
            </div>

            <div class="mb-4">
              <label class="form-label">Stops</label>
              <div class="flex flex-col gap-2">
                <label><input type="checkbox" class="filter-input" checked> Any</label>
                <label><input type="checkbox" class="filter-input"> Direct</label>
                <label><input type="checkbox" class="filter-input"> 1 Stop</label>
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label">Airlines</label>
              <div class="flex flex-col gap-2">
                <label><input type="checkbox" class="filter-input" checked> SkyWay Airlines</label>
                <label><input type="checkbox" class="filter-input" checked> Eagle Air</label>
                <label><input type="checkbox" class="filter-input" checked> Oceanic Airlines</label>
              </div>
            </div>
          </div>
        </aside>

        <!-- Results -->
        <main>
          <div class="flex justify-between items-center mb-4">
            <h3 style="margin: 0;">Available Flights</h3>
            <select class="form-control" style="width: auto;">
              <option>Cheapest First</option>
              <option>Fastest First</option>
              <option>Best Value</option>
            </select>
          </div>

          <div id="flights-container">
            <!-- Rendered via JS -->
          </div>
        </main>
      </div>

    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/results.js"></script>
</body>
</html>
